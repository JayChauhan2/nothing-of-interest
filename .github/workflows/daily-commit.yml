name: Daily Commit

on:
  schedule:
    - cron: "0 6 * * *" # Runs at 6:00 AM UTC every day
  workflow_dispatch: # Allows manual trigger

jobs:
  commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Make daily change
        run: |
          echo "Daily commit: $(date -u)" >> daily-log.txt
          echo "Last updated: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" > LAST_COMMIT.md

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add daily-log.txt LAST_COMMIT.md

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily auto commit - $(date -u +'%Y-%m-%d')"
            git push
          fi
