name: Daily Commit

on:
  schedule:
    - cron: "0 6 * * *" # 6:00 AM UTC every day
  workflow_dispatch:

permissions:
  contents: write # ← This is the important fix

jobs:
  commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make daily change
        run: |
          echo "Daily commit: $(date -u)" >> daily-log.txt
          echo "# Daily Auto Commit" > LAST_COMMIT.md
          echo "Last updated: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> LAST_COMMIT.md

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add daily-log.txt LAST_COMMIT.md

          if git diff --staged --quiet; then
            echo "No changes to commit today"
          else
            git commit -m "Daily auto commit - $(date -u +'%Y-%m-%d')"
            git push
            echo "Successfully committed and pushed"
          fi
